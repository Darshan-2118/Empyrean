# =============================================================================
# EMPYREAN — Mosquitto MQTT Broker Config (FUTURE: replaces public HiveMQ broker)
# =============================================================================
# STATUS: Not in use yet. Currently using public broker (broker.hivemq.com).
#
# WHEN TO USE THIS:
#   - When you switch to docker-compose (local Mosquitto container)
#   - Update backend/.env: MQTT_BROKER_HOST=localhost (or "mosquitto" inside Docker)
#
# Port 1883 = plaintext MQTT (development)
# Port 8883 = MQTTS with TLS (production — requires certs)
# =============================================================================

listener 1883 0.0.0.0
allow_anonymous true

# PRODUCTION TLS CONFIG (uncomment when you have certificates):
# listener 8883
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# cafile /mosquitto/config/certs/ca.crt
# require_certificate true    # ESP32 devices must present client certificates
